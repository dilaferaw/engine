repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy (strict, engine only)
        entry: uv run mypy engine
        language: system
        pass_filenames: false
        always_run: true